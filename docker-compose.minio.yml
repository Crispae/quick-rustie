# Local MinIO for quick-rustie (same defaults as RustIE's rustie-minio).
# If `rustie-minio` is already running, you do not need to start this.
services:
  minio:
    image: minio/minio:latest
    container_name: rustie-minio
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - rustie_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 minioadmin minioadmin 2>/dev/null; do sleep 1; done;
        mc mb local/rustie-dev --ignore-existing;
        echo 'Bucket rustie-dev ready';
      "

volumes:
  rustie_minio_data:
