[package]
name = "rustie-schema"
version = "0.1.0"
edition = "2021"
description = "RustIE postings document model and Quickwit doc mapping for sentence-level IE indexing"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"

[dev-dependencies]
pretty_assertions = "1"
