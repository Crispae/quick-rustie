[workspace]
resolver = "2"
members = [".", "crates/rustie-query", "crates/rustie-schema", "crates/rustie-compiler", "crates/rustie-indexer", "crates/rustie-search", "crates/rustie-graph-store", "crates/rustie-leaf"]

[package]
name = "quick_rustie"
version = "0.1.0"
edition = "2024"
description = "Boilerplate Rust library for Quickwit indexing on S3"
license = "Apache-2.0"
repository = "https://github.com/quickwit-oss/quickwit"

[dependencies]
anyhow = "1"

# RustIE query language (AST + pest parser), vendored in this workspace.
rustie-query = { path = "crates/rustie-query" }
# Odinson → sentence docs + Quickwit postings mapping.
rustie-schema = { path = "crates/rustie-schema" }
# Pattern → Quickwit candidate filters + in-memory graph/surface plans.
rustie-compiler = { path = "crates/rustie-compiler" }
# MinIO helpers + Odinson → Quickwit indexing pipeline.
rustie-indexer = { path = "crates/rustie-indexer" }
# Query execution over the index (library + HTTP API).
rustie-search = { path = "crates/rustie-search" }

# Quickwit OSS — https://github.com/quickwit-oss/quickwit
# S3 support is always compiled into quickwit-storage (no feature flag).
# Pin to v0.9.0 for a reproducible indexing + S3 stack.
quickwit-aws = { git = "https://github.com/quickwit-oss/quickwit.git", tag = "v0.9.0" }
quickwit-common = { git = "https://github.com/quickwit-oss/quickwit.git", tag = "v0.9.0" }
quickwit-config = { git = "https://github.com/quickwit-oss/quickwit.git", tag = "v0.9.0" }
quickwit-doc-mapper = { git = "https://github.com/quickwit-oss/quickwit.git", tag = "v0.9.0" }
quickwit-indexing = { git = "https://github.com/quickwit-oss/quickwit.git", tag = "v0.9.0" }
quickwit-metastore = { git = "https://github.com/quickwit-oss/quickwit.git", tag = "v0.9.0" }
quickwit-storage = { git = "https://github.com/quickwit-oss/quickwit.git", tag = "v0.9.0" }

# Pin to the Tokio version Quickwit v0.9.0 locks; newer minors need care with
# tokio_unstable APIs used by quickwit-common.
tokio = { version = "=1.52.3", features = ["full"] }

[[example]]
name = "minio_ping"
path = "examples/minio_ping.rs"

# Quickwit fork (https://github.com/Crispae/quickwit-custom, branch `rustie-ext`, based on cc420c3) with the generic extension hooks RustIE
# needs. Every quickwit crate in the dependency graph must be patched, otherwise cargo would mix
# fork and upstream types. See docs/rustie-fork.md.
[patch."https://github.com/quickwit-oss/quickwit.git"]
quickwit-actors = { path = "../quickwit-fork/quickwit/quickwit-actors" }
quickwit-aws = { path = "../quickwit-fork/quickwit/quickwit-aws" }
quickwit-cluster = { path = "../quickwit-fork/quickwit/quickwit-cluster" }
quickwit-codegen = { path = "../quickwit-fork/quickwit/quickwit-codegen" }
quickwit-common = { path = "../quickwit-fork/quickwit/quickwit-common" }
quickwit-config = { path = "../quickwit-fork/quickwit/quickwit-config" }
quickwit-datetime = { path = "../quickwit-fork/quickwit/quickwit-datetime" }
quickwit-directories = { path = "../quickwit-fork/quickwit/quickwit-directories" }
quickwit-doc-mapper = { path = "../quickwit-fork/quickwit/quickwit-doc-mapper" }
quickwit-dst = { path = "../quickwit-fork/quickwit/quickwit-dst" }
quickwit-index-management = { path = "../quickwit-fork/quickwit/quickwit-index-management" }
quickwit-indexing = { path = "../quickwit-fork/quickwit/quickwit-indexing" }
quickwit-ingest = { path = "../quickwit-fork/quickwit/quickwit-ingest" }
quickwit-macros = { path = "../quickwit-fork/quickwit/quickwit-macros" }
quickwit-metastore = { path = "../quickwit-fork/quickwit/quickwit-metastore" }
quickwit-metrics = { path = "../quickwit-fork/quickwit/quickwit-metrics" }
quickwit-opentelemetry = { path = "../quickwit-fork/quickwit/quickwit-opentelemetry" }
quickwit-parquet-engine = { path = "../quickwit-fork/quickwit/quickwit-parquet-engine" }
quickwit-proto = { path = "../quickwit-fork/quickwit/quickwit-proto" }
quickwit-query = { path = "../quickwit-fork/quickwit/quickwit-query" }
quickwit-search = { path = "../quickwit-fork/quickwit/quickwit-search" }
quickwit-storage = { path = "../quickwit-fork/quickwit/quickwit-storage" }
quickwit-transport = { path = "../quickwit-fork/quickwit/quickwit-transport" }
