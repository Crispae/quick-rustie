quickwit-doc-mapper = { git = "https://github.com/Crispae/quickwit-custom", rev = "4488aed884b7e99eec7b362fe07523a88e41fb19" }
quickwit-dst = { git = "https://github.com/Crispae/quickwit-custom", rev = "4488aed884b7e99eec7b362fe07523a88e41fb19" }
quickwit-index-management = { git = "https://github.com/Crispae/quickwit-custom", rev = "4488aed884b7e99eec7b362fe07523a88e41fb19" }
